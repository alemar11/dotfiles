onboarding = false
[theme]
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom]
active_row_bg = "#45475A"

[ui]
sidebar_width = 36
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
status_indicators = "dots"
agent_panel_sort = "priority"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[keys]
goto = "prefix+g"
copy_mode = "prefix+y"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && exec lazygit'
description = "Git status"
width = "90%"
height = "85%"

[ui.sidebar.agents]
rows = [["state_icon", { token = "workspace", fg = "#A78BFA", bold = true }, "agent"], ["tab"]]

[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", fg = "#A78BFA", bold = true }], ["branch", "git_status"]]
