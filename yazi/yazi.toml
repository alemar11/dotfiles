[mgr]
# Hide the parent-folder pane; keep the current folder and preview.
ratio = [0, 4, 3]

# Open text files in Vim and use macOS handlers for previews/documents.
[opener]
xcode = [
  { run = "xed %s", orphan = true, for = "macos", desc = "Xcode" },
]
edit = [
  { run = "vim %s", block = true, for = "macos", desc = "Vim" },
]
open = [
  { run = "open %s", orphan = true, for = "macos", desc = "Open" },
]

[open]
prepend_rules = [
  { url = "*.{swift,h,m,mm}", use = [ "xcode", "edit", "open" ] },
  { mime = "text/*", use = [ "edit", "open" ] },
  { url = "*.{c,cc,conf,cpp,css,csv,env,fish,go,graphql,h,hpp,html,ini,java,js,json,jsonc,jsx,kt,log,lua,md,mjs,py,rb,rs,scss,sh,sql,swift,toml,ts,tsx,txt,xml,yaml,yml,zsh}", use = [ "edit", "open" ] },
  { mime = "application/pdf", use = "open" },
  { mime = "image/*", use = "open" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
